name: Cloud release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: Explicit release operation (public requires managed acceptance)
        type: choice
        options: [candidate, public, rollback, pause]
        default: candidate
        required: true
      image:
        description: Immutable image reference for public release
        type: string
      candidate_run:
        description: Successful candidate run ID for public release
        type: string
      rollback_run:
        description: Previous public/pause run ID whose saved traffic must be restored
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: nexus-cloud-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      vars.NEXUS_RELEASE_ENABLED == 'true' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: nexus-release
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      RELEASE_ACTION: ${{ inputs.action || 'candidate' }}
      NEXUS_RELEASE_ENABLED: ${{ vars.NEXUS_RELEASE_ENABLED }}
      NEXUS_CONFIG_JSON: ${{ vars.NEXUS_CONFIG_JSON }}
      GH_TOKEN: ${{ github.token }}
      INPUT_IMAGE: ${{ inputs.image }}
      CANDIDATE_RUN: ${{ inputs.candidate_run }}
      ROLLBACK_RUN: ${{ inputs.rollback_run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Require exact-commit CI before cloud authentication
        run: python scripts/verify_release_ci.py
      - run: python -m pip install -r requirements.lock && python -m pip install -e . --no-deps
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        id: auth
        with:
          workload_identity_provider: ${{ vars.NEXUS_WIF_PROVIDER }}
          service_account: ${{ vars.NEXUS_RELEASE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 3600s
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          version: '>= 541.0.0'
      - name: Prepare nonsecret operator configuration
        run: |
          mkdir -p .tmp-release
          python -c "import json,os,pathlib; c=json.loads(os.environ['NEXUS_CONFIG_JSON']); pathlib.Path('.tmp-release/config.json').write_text(json.dumps(c))"
      - name: Authenticate Artifact Registry
        if: env.RELEASE_ACTION == 'candidate'
        env:
          CLOUDSDK_AUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: gcloud auth configure-docker us-west1-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: env.RELEASE_ACTION == 'candidate'
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: image
        env:
          CLOUDSDK_AUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        if: env.RELEASE_ACTION == 'candidate'
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: us-west1-docker.pkg.dev/nexus-agent-510512/nexusagent/app:${{ env.RELEASE_SHA }}
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        id: release_auth
        with:
          workload_identity_provider: ${{ vars.NEXUS_WIF_PROVIDER }}
          service_account: ${{ vars.NEXUS_RELEASE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 3600s
      - name: Ingest, validate preview, or perform explicit release operation
        env:
          BUILT_DIGEST: ${{ steps.image.outputs.digest }}
          CLOUDSDK_AUTH_ACCESS_TOKEN: ${{ steps.release_auth.outputs.access_token }}
        run: |
          if [[ "$RELEASE_ACTION" == candidate ]]; then
            INPUT_IMAGE="us-west1-docker.pkg.dev/nexus-agent-510512/nexusagent/app@$BUILT_DIGEST"
          fi
          python -m scripts.run_cloud_release "$RELEASE_ACTION" --config .tmp-release/config.json \
            --image "$INPUT_IMAGE" --candidate-run "$CANDIDATE_RUN" --rollback-run "$ROLLBACK_RUN"
